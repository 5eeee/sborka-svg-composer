const intersection=(a,b)=>Math.max(0,Math.min(a.x+a.w/2,b.x+b.w/2)-Math.max(a.x-a.w/2,b.x-b.w/2))*Math.max(0,Math.min(a.y+a.h/2,b.y+b.h/2)-Math.max(a.y-a.h/2,b.y-b.h/2));

 const margin=Math.min(width,height)*.07,placed=[],phase=((variant%11)+11)%11;
 for(const [i,id] of ids.slice(0,4).entries()){
  const ratio=ratios[id]||RATIOS[id]||1;
  const w=Math.min(width*(i===0?.46:.28),height*(i===0?.58:.31)/ratio),h=w*ratio;

  if(i===0){item.x+=Math.sin(phase*1.7)*width*.035;item.y+=Math.cos(phase*1.3)*height*.025;}
  else{
   let best=null;
   for(let step=0;step<48;step++){
    const angle=(step+phase*2+i*7)*Math.PI/24;
    const x=width*.5+Math.cos(angle)*width*.31,y=height*.51+Math.sin(angle)*height*.29;
    const candidate={x:Math.min(width-margin-w/2,Math.max(margin+w/2,x)),y:Math.min(height-margin-h/2,Math.max(margin+h/2,y)),w,h};
    const overlap=placed.reduce((n,p)=>n+intersection(candidate,p)/Math.min(w*h,p.w*p.h),0);

    const score=overlap*20+balance+((step+phase*5)%48)*.0003;
    if(!best||score<best.score)best={...candidate,score};
   }
   item.x=best.x;item.y=best.y;
  }
  item.x=Math.min(width-margin-w/2,Math.max(margin+w/2,item.x));item.y=Math.min(height-margin-h/2,Math.max(margin+h/2,item.y));

$('#canvas').onpointerdown=e=>{const g=e.target.closest('[data-uid]');if(!g){selected=null;render();return;}selected=g.dataset.uid;const o=state.objects.find(o=>o.uid===selected);snapshot();const p=point(e);drag={uid:o.uid,dx:p.x-o.x,dy:p.y-o.y};$('#canvas').setPointerCapture(e.pointerId);render();};$('#canvas').onpointermove=e=>{if(!drag)return;const p=point(e),o=state.objects.find(o=>o.uid===drag.uid);o.x=clamp(p.x-drag.dx,-state.w,state.w*2);o.y=clamp(p.y-drag.dy,-state.h,state.h*2);render();};$('#canvas').onpointerup=()=>drag=null;$('#canvas').onpointercancel=()=>drag=null;

async function init(){try{assets=new Map(Object.entries(EMBEDDED_ASSETS));const saved=demoMode?null:localStorage.getItem('svg-assembly');if(saved){try{const p=JSON.parse(saved);customAssets=p.customAssets||[];registerCustom();if(p.version===1&&p.state?.objects?.every(o=>library.some(a=>a.id===o.id)))state=p.state;}catch{localStorage.removeItem('svg-assembly');}}document.querySelectorAll('button,input,textarea,select').forEach(e=>e.disabled=false);$('#idea').value=state.idea||'Обучение без отвлечений';renderLibrary();if(state.backgroundEnabled===undefined)state.backgroundEnabled=!state.objects.some(o=>o.background&&o.hidden);if(state.palette==='custom'){try{state.customPalette=validPalette(state.customPalette);}catch{state.palette='original';toast('Старая палитра не прошла проверку ролей. Загрузите исправленную.');}}if(!state.objects.length)compose(0);else render();}catch(e){$('#sceneInfo').textContent='Не удалось загрузить библиотеку';toast(e.message);}}
document.querySelectorAll('button,input,textarea,select').forEach(e=>e.disabled=true);
init();


const insert=document.createElement('button');insert.className='primary';insert.id='insertFigma';insert.textContent='Добавить в Figma';document.querySelector('.header-actions').append(insert);
insert.onclick=()=>{try{const out=$('#canvas').cloneNode(true);out.querySelectorAll('[data-selection]').forEach(n=>n.remove());out.removeAttribute('id');out.removeAttribute('style');out.setAttribute('width',state.w);out.setAttribute('height',state.h);insert.disabled=true;parent.postMessage({pluginMessage:{type:'insert',svg:new XMLSerializer().serializeToString(out),name:state.idea||'Композиция',width:state.w,height:state.h}},'*');toast('Создаю векторные слои…');}catch(e){toast(e.message);insert.disabled=false;}};
window.addEventListener('message',e=>{const m=e.data.pluginMessage;if(m?.type==='status'){toast(m.text);insert.disabled=false;}});

}catch(e){document.getElementById('sceneInfo').textContent='Ошибка загрузки: '+e.message;}})();</script></body></html>
